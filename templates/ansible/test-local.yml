---
- name: Learn the ALIS workflow on a local simulator
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    alis_python: "{{ ansible_playbook_python }}"
    alis_simulation: true
    alis_timeout: 120
    alis_poll_interval: 1
  tasks:
    - name: Explain the simulation
      ansible.builtin.debug:
        msg: This test creates a temporary local directory and fake Oracle tools. It never uses inventory.yml, your Oracle configuration, SSH, MOS or a database.

    - name: Create a temporary sandbox
      ansible.builtin.tempfile:
        state: directory
        prefix: alis-simulation-
      register: alis_sandbox

    - name: Prepare fake tools and an independent simulation plan
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/tests/simulator.py"
          - setup
          - "{{ alis_sandbox.path }}"
          - "{{ alis_test_failure | default('none') }}"
      changed_when: true

    - name: Use the independent sandbox bundle
      ansible.builtin.set_fact:
        alis_bundle_dir: "{{ alis_sandbox.path }}"
        alis_work_dir: "{{ alis_sandbox.path }}/run"

- ansible.builtin.import_playbook: patch.yml
  vars: &simulation_vars
    alis_hosts: localhost
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    alis_python: "{{ ansible_playbook_python }}"
    alis_simulation: true
    alis_become: false
    alis_oracle_user: simulation
    alis_timeout: 120
    alis_poll_interval: 1
- ansible.builtin.import_playbook: deploy.yml
  vars: *simulation_vars

- name: Report the local simulation results
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Show where to inspect the simulation
      ansible.builtin.debug:
        msg: "Simulation passed. Results: {{ alis_sandbox.path }}/run/results. The last deploy was skipped because this patch cycle already succeeded."
